name: lichess

# Profiles: lake | spark | stream | olap | bi
# Start with: make up PROFILES="lake"
# Host ports use the 2xxxx range (the fraud project uses 18xxx/19xxx).

x-spark: &spark
  image: lichess/spark:4.1.1-delta4.4.0
  profiles: ["spark"]
  restart: unless-stopped
  environment:
    AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:?S3_ACCESS_KEY must be set in .env}
    AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY must be set in .env}
    AWS_REGION: us-east-1
    LAKE_BUCKET: ${LAKE_BUCKET:-lake}
    SPARK_DAEMON_MEMORY: 512m
  volumes:
    - ./spark/conf/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
  depends_on:
    seaweedfs:
      condition: service_healthy

x-spark-worker: &spark-worker
  <<: *spark
  command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077"]
  environment:
    AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:?S3_ACCESS_KEY must be set in .env}
    AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY must be set in .env}
    AWS_REGION: us-east-1
    LAKE_BUCKET: ${LAKE_BUCKET:-lake}
    SPARK_DAEMON_MEMORY: 512m
    SPARK_WORKER_CORES: ${SPARK_WORKER_CORES:-2}
    SPARK_WORKER_MEMORY: ${SPARK_WORKER_MEMORY:-2560m}
  depends_on:
    spark-master:
      condition: service_healthy
  healthcheck:
    test: ["CMD", "curl", "-fs", "-o", "/dev/null", "http://127.0.0.1:8081/json/"]
    interval: 5s
    timeout: 3s
    retries: 24
  deploy:
    resources:
      limits:
        memory: 3584m

services:
  seaweedfs:
    image: chrislusf/seaweedfs:4.54@sha256:4b42c212543a0acd4c0e675215ecdcaf62a186ef98def76c7e12701871222d15
    profiles: ["lake"]
    restart: unless-stopped
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?S3_ACCESS_KEY must be set in .env}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY must be set in .env}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        cat > /tmp/s3.json <<JSON
        {"identities":[{"name":"admin","credentials":[{"accessKey":"$${S3_ACCESS_KEY}","secretKey":"$${S3_SECRET_KEY}"}],"actions":["Admin","Read","List","Tagging","Write"]}]}
        JSON
        exec weed server -dir=/data -s3 -s3.port=8333 -s3.config=/tmp/s3.json
    ports:
      - "127.0.0.1:${S3_PORT:-28333}:8333"            # S3 API
      - "127.0.0.1:${SEAWEED_FILER_PORT:-28888}:8888"  # filer UI
      - "127.0.0.1:${SEAWEED_MASTER_PORT:-29333}:9333" # master UI
    volumes:
      - seaweedfs-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8333/healthz"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 1g

  # --- Spark standalone cluster (profile: spark) -------------------------------
  # Memory budget for ~9.7 GB Docker: 2 workers x 3.5g + master 0.75g + history 0.75g + seaweedfs 1g.

  spark-master:
    <<: *spark
    build: ./spark   # built once here; every other Spark service reuses the image
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master"]
    ports:
      - "127.0.0.1:${SPARK_MASTER_UI_PORT:-28080}:8080"
    healthcheck:
      test: ["CMD", "curl", "-fs", "-o", "/dev/null", "http://127.0.0.1:8080/json/"]
      interval: 5s
      timeout: 3s
      retries: 24
    deploy:
      resources:
        limits:
          memory: 768m

  spark-worker-1:
    <<: *spark-worker
    ports:
      - "127.0.0.1:${SPARK_WORKER1_UI_PORT:-28081}:8081"

  spark-worker-2:
    <<: *spark-worker
    ports:
      - "127.0.0.1:${SPARK_WORKER2_UI_PORT:-28082}:8081"

  spark-history:
    <<: *spark
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.history.HistoryServer"]
    ports:
      - "127.0.0.1:${SPARK_HISTORY_UI_PORT:-28180}:18080"
    healthcheck:
      test: ["CMD", "curl", "-fs", "-o", "/dev/null", "http://127.0.0.1:18080/api/v1/applications"]
      interval: 5s
      timeout: 3s
      retries: 24
    deploy:
      resources:
        limits:
          memory: 768m

  # One-shot job runner: `make spark-smoke` / `docker compose run --rm spark-submit <job.py>`
  spark-submit:
    <<: *spark
    profiles: ["tools"]
    restart: "no"
    working_dir: /opt/project
    entrypoint:
      - /bin/sh
      - -c
      - exec /opt/spark/bin/spark-submit --conf spark.driver.host=$$(hostname -i) --conf spark.driver.bindAddress=0.0.0.0 "$$@"
      - spark-submit
    volumes:
      - ./spark/conf/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
      - .:/opt/project:ro
    depends_on:
      spark-master:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 2g

  # --- ClickHouse (profile: olap) ------------------------------------------------

  clickhouse:
    image: clickhouse/clickhouse-server:26.8.40.7@sha256:6d462904f276dc6c1fa531d887cac02d4ef7a8f212d6142377d36608c2330d59
    profiles: ["olap"]
    restart: unless-stopped
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:?CLICKHOUSE_USER must be set in .env}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?CLICKHOUSE_PASSWORD must be set in .env}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?S3_ACCESS_KEY must be set in .env}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY must be set in .env}
      CLICKHOUSE_SUPERSET_PASSWORD: ${CLICKHOUSE_SUPERSET_PASSWORD:?CLICKHOUSE_SUPERSET_PASSWORD must be set in .env}
    ports:
      - "127.0.0.1:${CLICKHOUSE_HTTP_PORT:-28123}:8123"    # HTTP
      - "127.0.0.1:${CLICKHOUSE_NATIVE_PORT:-29000}:9000"  # native
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./clickhouse/config.d/named_collections.xml:/etc/clickhouse-server/config.d/named_collections.xml:ro
      - ./clickhouse/users.d/lichess.xml:/etc/clickhouse-server/users.d/lichess.xml:ro
      - ./clickhouse/users.d/superset_ro.xml:/etc/clickhouse-server/users.d/superset_ro.xml:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user \"$$CLICKHOUSE_USER\" --password \"$$CLICKHOUSE_PASSWORD\" -q 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 3g

  # --- Kafka, KRaft single node (profile: stream) ---------------------------------
  # Containers use kafka:9092; host processes (collectors, tests) use localhost:29092.

  kafka:
    image: apache/kafka:4.4.0@sha256:833b867a9585a141da455dc2b57431c65cbccb27f11c91f694444cca9f777e0f
    profiles: ["stream"]
    restart: unless-stopped
    environment:
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:?KAFKA_CLUSTER_ID must be set in .env}
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:${KAFKA_EXTERNAL_PORT:-29092},CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:${KAFKA_EXTERNAL_PORT:-29092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_MIN_INSYNC_REPLICAS: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms512m -Xmx512m
    ports:
      - "127.0.0.1:${KAFKA_EXTERNAL_PORT:-29092}:${KAFKA_EXTERNAL_PORT:-29092}"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 1g

  # --- Postgres: metadata DBs (profiles: olap, orch, bi) ---------------------------
  # sqlmesh_state (SQLMesh), prefect (Prefect server), superset (Superset metadata).

  postgres:
    image: postgres:18.7@sha256:e754b839f447639b7004895f4d8a4bfcb4e9dbe3a1bc035f27f646562a16fd61
    profiles: ["olap", "orch", "bi"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      SQLMESH_DB_PASSWORD: ${SQLMESH_DB_PASSWORD:?SQLMESH_DB_PASSWORD must be set in .env}
      PREFECT_DB_PASSWORD: ${PREFECT_DB_PASSWORD:?PREFECT_DB_PASSWORD must be set in .env}
      SUPERSET_DB_PASSWORD: ${SUPERSET_DB_PASSWORD:?SUPERSET_DB_PASSWORD must be set in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-25432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql   # Postgres 18+ layout (not .../data)
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512m

  # --- Prefect 3 server (profile: orch) ---------------------------------------------

  prefect-server:
    image: prefecthq/prefect:3.9.3-python3.12@sha256:1f32e854effefa290527f87a0a10346f6f84ce31047d0e3e5a4d4210d6450a30
    profiles: ["orch"]
    restart: unless-stopped
    command: ["prefect", "server", "start", "--host", "0.0.0.0", "--port", "4200"]
    environment:
      PREFECT_API_DATABASE_CONNECTION_URL: postgresql+asyncpg://prefect:${PREFECT_DB_PASSWORD:?PREFECT_DB_PASSWORD must be set in .env}@postgres:5432/prefect
      PREFECT_UI_API_URL: http://localhost:${PREFECT_PORT:-24200}/api
      PREFECT_SERVER_ANALYTICS_ENABLED: "false"
    ports:
      - "127.0.0.1:${PREFECT_PORT:-24200}:4200"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4200/api/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 1g

  # --- Superset (profile: bi; dashboards need olap too) -------------------------------

  superset:
    image: lichess/superset:6.1.0
    build: ./superset
    profiles: ["bi"]
    restart: unless-stopped
    command: ["/app/docker-bootstrap/bootstrap.sh"]
    environment:
      SUPERSET_CONFIG_PATH: /app/pythonpath/superset_config.py
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:?SUPERSET_SECRET_KEY must be set in .env}
      SUPERSET_DB_PASSWORD: ${SUPERSET_DB_PASSWORD:?SUPERSET_DB_PASSWORD must be set in .env}
      SUPERSET_ADMIN_USER: ${SUPERSET_ADMIN_USER:?SUPERSET_ADMIN_USER must be set in .env}
      SUPERSET_ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD:?SUPERSET_ADMIN_PASSWORD must be set in .env}
      CLICKHOUSE_SUPERSET_PASSWORD: ${CLICKHOUSE_SUPERSET_PASSWORD:?CLICKHOUSE_SUPERSET_PASSWORD must be set in .env}
    ports:
      - "127.0.0.1:${SUPERSET_PORT:-28088}:8088"
    volumes:
      - ./superset/superset_config.py:/app/pythonpath/superset_config.py:ro
      - ./superset/bootstrap.sh:/app/docker-bootstrap/bootstrap.sh:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fs", "-o", "/dev/null", "http://127.0.0.1:8088/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 1536m

volumes:
  seaweedfs-data:
  clickhouse-data:
  kafka-data:
  postgres-data:

[project]
name = "lichess-analytics-platform"
version = "0.1.0"
description = "Chess analytics on Lichess data: Spark + Delta batch, Kafka + ClickHouse real-time OLAP."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = []

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pre-commit>=3.8",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["sqlmesh", "superset"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N", "RUF", "PT", "C4"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
files = ["ingest", "live", "flows", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"

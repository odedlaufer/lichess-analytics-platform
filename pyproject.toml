[project]
name = "lichess-analytics-platform"
version = "0.1.0"
description = "Chess analytics on Lichess data: Spark + Delta batch, Kafka + ClickHouse real-time OLAP."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
    "boto3>=1.35",
    "clickhouse-connect>=0.8",
    "confluent-kafka>=2.6",
    "httpx>=0.27",
    "prefect==3.9.3",  # must equal the server image version
]

[dependency-groups]
dev = [
    "boto3-stubs[s3]>=1.35",
    "mypy>=1.11",
    "psycopg[binary]>=3.2",
    "pre-commit>=3.8",
    "pyspark==4.1.1",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["sqlmesh"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N", "RUF", "PT", "C4"]

[tool.ruff.lint.per-file-ignores]
"spark/**" = ["N812"]  # `functions as F` is the PySpark convention

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
files = ["ingest", "live", "flows", "spark", "tools", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers -m 'not integration'"
markers = [
    "integration: needs running services (make up)",
]
